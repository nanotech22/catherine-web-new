name: Update public calendar

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-public-calendar
  cancel-in-progress: true

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-calendar.txt

      - name: Install calendar parser
        run: python -m pip install -r requirements-calendar.txt

      - name: Build events.json from Google Calendar iCal feed
        env:
          CALENDAR_ICS_URL: ${{ secrets.CALENDAR_ICS_URL }}
          MAX_EVENTS: "8"
          LOOKAHEAD_DAYS: "365"
        run: python scripts/update_calendar.py

      - name: Commit calendar changes
        run: |
          if git diff --quiet -- events.json; then
            echo "No calendar changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json
          git commit -m "Update public events"
          git push
