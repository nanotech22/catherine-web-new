name: Update public calendar

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: calendar-update
  cancel-in-progress: false

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install calendar parser
        run: |
          pip install icalendar recurring-ical-events requests

      - name: Build events.json from Google Calendar iCal feed
        env:
          CALENDAR_ICS_URL: ${{ secrets.CALENDAR_ICS_URL }}
        run: |
          python scripts/update_calendar.py

      - name: Commit calendar changes
        run: |
          if git diff --quiet -- events.json; then
            echo "No calendar changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add events.json
          git commit -m "Update public events"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main