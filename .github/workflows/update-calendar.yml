name: Update public calendar

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: calendar-update
  cancel-in-progress: false

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    steps:
      # checkout
      # Python setup
      # install parser
      # build events.json

      - name: Commit calendar changes
        run: |
          if git diff --quiet -- events.json; then
            echo "No calendar changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add events.json
          git commit -m "Update public events"

          git pull --rebase origin main
          git push origin main